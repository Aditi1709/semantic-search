services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: semantic-search-db
    environment:
      POSTGRES_DB: semantic_search
      POSTGRES_USER: aditiagarwal
      POSTGRES_PASSWORD: semantic_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: